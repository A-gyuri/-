<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>대전 무더위쉼터 지도</title>
<script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=d360767ee38c65deb14d09bb002a55a2&libraries=services"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #F0F4F8;
    --surface: #FFFFFF;
    --primary: #1A6FBF;
    --primary-dark: #124F8A;
    --text-main: #1C2B3A;
    --text-sub: #5A7080;
    --border: #D0DCE8;
    --green: #1A9A5A;
    --yellow: #D9900A;
    --red: #C93030;
    --green-light: #E6F7EE;
    --yellow-light: #FFF5E0;
    --red-light: #FDECEC;
    --shadow: 0 2px 12px rgba(26,111,191,0.10);
    --radius: 14px;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    color: var(--text-main);
    overflow: hidden;
    height: 100vh;
  }

  #map {
    width: 100%;
    height: 100vh;
    position: absolute;
    top: 0;
    left: 0;
    z-index: 1;
  }

  /* 상단 가로 스크롤 필터 */
  .filter-container {
    position: absolute;
    top: 16px;
    left: 0;
    right: 0;
    z-index: 10;
    padding: 0 16px;
    overflow-x: auto;
    display: flex;
    gap: 8px;
    scroll-behavior: smooth;
  }
  .filter-container::-webkit-scrollbar { display: none; }

  .filter-chip {
    flex: 0 0 auto;
    background: var(--surface);
    padding: 10px 16px;
    border-radius: 30px;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-sub);
    box-shadow: var(--shadow);
    border: 1px solid transparent;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .filter-chip.active {
    background: var(--primary);
    color: #FFF;
    border-color: var(--primary);
  }

  /* 내 위치 버튼 */
  #myloc-btn {
    position: absolute;
    bottom: 32px;
    right: 16px;
    z-index: 10;
    width: 50px;
    height: 50px;
    background: var(--surface);
    border: none;
    border-radius: 50%;
    box-shadow: var(--shadow);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #myloc-btn img {
    width: 24px;
    height: 24px;
  }

  /* 하단 바텀 시트 */
  .bottom-sheet {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: var(--surface);
    border-top-left-radius: var(--radius);
    border-top-right-radius: var(--radius);
    box-shadow: 0 -4px 20px rgba(0,0,0,0.08);
    z-index: 20;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
    padding: 24px 20px;
  }
  .bottom-sheet.open {
    transform: translateY(0);
  }

  .sheet-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 12px;
  }
  .sheet-title {
    font-size: 20px;
    font-weight: 700;
    color: var(--text-main);
    line-height: 1.3;
  }
  .close-btn {
    background: none;
    border: none;
    font-size: 22px;
    color: var(--text-sub);
    cursor: pointer;
    padding: 0 4px;
  }

  .sheet-addr {
    font-size: 14px;
    color: var(--text-sub);
    margin-bottom: 16px;
    line-height: 1.4;
  }

  .info-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .info-card {
    background: var(--bg);
    padding: 14px;
    border-radius: 10px;
    text-align: center;
  }
  .card-label {
    font-size: 12px;
    color: var(--text-sub);
    margin-bottom: 4px;
  }
  .card-value {
    font-size: 16px;
    font-weight: 700;
  }

  /* 인포윈도우 커스텀 CSS (지도 내부 마커용) */
  .custom-overlay {
    background: var(--surface);
    padding: 8px 12px;
    border-radius: 20px;
    box-shadow: var(--shadow);
    border: 1px solid var(--border);
    font-size: 13px;
    font-weight: 700;
    color: var(--text-main);
    white-space: nowrap;
    position: relative;
    bottom: 45px;
  }
  .custom-overlay::after {
    content: '';
    position: absolute;
    bottom: -6px;
    left: 50%;
    transform: translateX(-50%);
    border-width: 6px 6px 0;
    border-style: solid;
    border-color: var(--surface) transparent;
    display: block;
    width: 0;
  }
</style>
</head>
<body>

<div class="filter-container">
  <div class="filter-chip active" data-type="all">전체보기</div>
  <div class="filter-chip" data-type="green">여유 (50명 이상)</div>
  <div class="filter-chip" data-type="yellow">보통 (30명~49명)</div>
  <div class="filter-chip" data-type="red">혼잡 (30명 미만)</div>
</div>

<div id="map"></div>

<button id="myloc-btn">
  <img src="https://cdn-icons-png.flaticon.com/512/854/854894.png" alt="내위치">
</button>

<div class="bottom-sheet" id="sheet">
  <div class="sheet-header">
    <div class="sheet-title" id="sh-name">쉼터 이름</div>
    <button class="close-btn" onclick="closeSheet()">✕</button>
  </div>
  <div class="sheet-addr" id="sh-addr">도로명 주소지 정보가 출력됩니다.</div>
  <div class="info-grid">
    <div class="info-card">
      <div class="card-label">수용 가능 인원</div>
      <div class="card-value" id="sh-cap">00명</div>
    </div>
    <div class="info-card" id="sh-status-card">
      <div class="card-label">혼잡도 상태</div>
      <div class="card-value" id="sh-status">여유</div>
    </div>
  </div>
</div>

<script>
// 1. 전역 변수 설정 (데이터는 빈 배열로 시작)
let shelters = [];
let markers = [];
let activeFilter = 'all';
let selectedShelter = null;
let currentPolyline = null;

// 임의의 가상 사용자 실시간 GPS 위치 (대전시청 중심점)
const myLocation = { lat: 36.3504119, lng: 127.3845475 };

// 카카오 지도 초기화
const mapContainer = document.getElementById('map');
const mapOption = {
  center: new kakao.maps.LatLng(myLocation.lat, myLocation.lng),
  level: 4
};
const map = new kakao.maps.Map(mapContainer, mapOption);

// 2. [핵심 수정] 웹 페이지 로딩 완료 시 외부 JSON 파일 읽어오기
window.addEventListener('DOMContentLoaded', () => {
  fetch('shelter_data.json')
    .then(response => {
      if (!response.ok) {
        throw new Error('데이터 파일을 읽어오지 못했습니다.');
      }
      return response.json();
    })
    .then(data => {
      shelters = data;      // 외부 데이터를 전역 변수에 저장
      initApp();            // 앱 초기화 로직 실행
    })
    .catch(error => {
      console.error('Error:', error);
      alert('쉼터 데이터를 불러오는 과정에서 문제가 발생했습니다.');
    });
});

function initApp() {
  // 사용자의 고유 위치 마커 그리기
  const myMarkerImage = new kakao.maps.MarkerImage(
    'https://cdn-icons-png.flaticon.com/512/684/684908.png',
    new kakao.maps.Size(36, 36)
  );
  const myMarker = new kakao.maps.Marker({
    position: new kakao.maps.LatLng(myLocation.lat, myLocation.lng),
    image: myMarkerImage,
    map: map
  });

  // 데이터 기반 마커 렌더링
  renderMarkers();
}

// 마커 클리어 및 재렌더링 기능
function renderMarkers() {
  // 기존 지도에 찍힌 마커들 삭제
  markers.forEach(m => m.setMap(null));
  markers = [];

  shelters.forEach(s => {
    // 수용 인원에 따른 구별조건 부여
    let type = 'red';
    let pinUrl = 'https://maps.google.com/mapfiles/ms/icons/red-dot.png'; // 혼잡 기본값
    
    if (s.capacity >= 50) {
      type = 'green';
      pinUrl = 'https://maps.google.com/mapfiles/ms/icons/green-dot.png';
    } else if (s.capacity >= 30) {
      type = 'yellow';
      pinUrl = 'https://maps.google.com/mapfiles/ms/icons/yellow-dot.png';
    }

    // 상단 가로 칩 필터링 검사 조건문
    if (activeFilter !== 'all' && activeFilter !== type) return;

    // 카카오맵 마커 생성 규칙 바인딩
    const markerImage = new kakao.maps.MarkerImage(pinUrl, new kakao.maps.Size(32, 32));
    const marker = new kakao.maps.Marker({
      position: new kakao.maps.LatLng(s.lat, s.lng),
      image: markerImage,
      map: map
    });

    // 마커 클릭 시 이벤트 추가
    kakao.maps.event.addListener(marker, 'click', () => {
      openSheet(s);
    });

    markers.push(marker);
  });
}

// 하단 상세정보 패널 오픈 처리 함수
function openSheet(s) {
  selectedShelter = s;
  document.getElementById('sh-name').innerText = s.name;
  document.getElementById('sh-addr').innerText = s.addr;
  document.getElementById('sh-cap').innerText  = s.capacity + '명';

  const statusText  = document.getElementById('sh-status');
  const statusCard  = document.getElementById('sh-status-card');

  if (s.capacity >= 50) {
    statusText.innerText = '원활 (쾌적)';
    statusCard.style.background = 'var(--green-light)';
    statusText.style.color = 'var(--green)';
    drawRouteLine(s, 'var(--green)');
  } else if (s.capacity >= 30) {
    statusText.innerText = '보통 (일반)';
    statusCard.style.background = 'var(--yellow-light)';
    statusText.style.color = 'var(--yellow)';
    drawRouteLine(s, 'var(--yellow)');
  } else {
    statusText.innerText = '혼잡 (제한)';
    statusCard.style.background = 'var(--red-light)';
    statusText.style.color = 'var(--red)';
    drawRouteLine(s, 'var(--red)');
  }

  document.getElementById('sheet').classList.add('open');
}

function closeSheet() {
  document.getElementById('sheet').classList.remove('open');
  if (currentPolyline) {
    currentPolyline.setMap(null);
    currentPolyline = null;
  }
}

// 내 위치와 목적지 간의 가상 호선 루트 드로잉 로직
function drawRouteLine(s, lineColor) {
  if (currentPolyline) currentPolyline.setMap(null);

  const from = new kakao.maps.LatLng(myLocation.lat, myLocation.lng);
  const to   = new kakao.maps.LatLng(s.lat, s.lng);

  const midLat = (myLocation.lat + s.lat) / 2 + 0.002;
  const midLng = (myLocation.lng + s.lng) / 2;
  const mid = new kakao.maps.LatLng(midLat, midLng);

  currentPolyline = new kakao.maps.Polyline({
    path: [from, mid, to],
    strokeWeight: 6,
    strokeColor: lineColor,
    strokeOpacity: 0.9,
    strokeStyle: 'solid'
  });
  currentPolyline.setMap(map);

  const bounds = new kakao.maps.LatLngBounds();
  bounds.extend(from);
  bounds.extend(to);
  map.setBounds(bounds);
}

// 상단 카테고리 필터 스위칭 클릭 이벤트 리스너 추가 
document.querySelectorAll('.filter-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    activeFilter = chip.dataset.type;
    closeSheet();
    renderMarkers();
  });
});

// 우측 하단 유저 트래킹 GPS 이동 버튼 리스너
document.getElementById('myloc-btn').addEventListener('click', () => {
  const locPosition = new kakao.maps.LatLng(myLocation.lat, myLocation.lng);
  map.setCenter(locPosition);
  map.setLevel(4);
});
</script>
</body>
</html>
